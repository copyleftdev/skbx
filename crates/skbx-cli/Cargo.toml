[package]
name = "skbx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Agent-first Linux packet-path observation with replayable evidence"
keywords = ["ebpf", "linux", "networking", "observability", "tracing"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "skbx"
path = "src/main.rs"

[features]
default = ["ebpf"]
ebpf = ["skbx-sensor/ebpf"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
file-rotate.workspace = true
flate2.workspace = true
libc.workspace = true
nix.workspace = true
pcap.workspace = true
serde.workspace = true
serde_json.workspace = true
skbx-contract.workspace = true
skbx-core.workspace = true
skbx-sensor.workspace = true
time.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.docs.rs]
no-default-features = true

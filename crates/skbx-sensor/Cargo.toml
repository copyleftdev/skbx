[package]
name = "skbx-sensor"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later AND GPL-2.0-only"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "CO-RE eBPF sensor and userspace event decoder for skbx"
keywords = ["bpf", "ebpf", "linux", "networking", "tracing"]
categories = ["network-programming", "os::linux-apis"]
build = "build.rs"

[features]
default = []
ebpf = ["dep:libbpf-rs", "dep:libc"]

[dependencies]
libc = { workspace = true, optional = true }
libbpf-rs = { workspace = true, optional = true }
skbx-contract.workspace = true
thiserror.workspace = true

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">skbx — Linux packet paths, with receipts</title>
  <desc id="desc">A packet flight recorder route crosses Linux kernel hooks and resolves into replayable evidence.</desc>
  <defs>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#3b4232" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4 0 8Z" fill="#d7ff3f"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#12150f"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".48"/>
  <path d="M-40 472C112 470 128 347 270 348S405 466 548 430 675 235 819 265 957 412 1245 299"
        fill="none" stroke="#d7ff3f" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="5 15" marker-end="url(#arrow)" opacity=".78"/>
  <path d="M-40 516C134 528 188 423 337 449S545 563 700 490 912 341 1235 414"
        fill="none" stroke="#3b4232" stroke-width="2" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="76" y="85" fill="#d7ff3f" font-size="18" font-weight="700" letter-spacing="4">LINUX / RUST / CO-RE eBPF</text>
    <text x="74" y="218" fill="#f2f5df" font-size="116" font-weight="800" letter-spacing="-10">skbx</text>
    <circle cx="323" cy="194" r="9" fill="#ff6b35" filter="url(#glow)"/>
    <text x="78" y="286" fill="#c2c7b3" font-size="28" letter-spacing=".5">packet paths, with receipts.</text>

    <g font-size="15" letter-spacing="1.2">
      <text x="92" y="395" fill="#c2c7b3">INGRESS</text>
      <text x="300" y="362" fill="#c2c7b3">KERNEL HOOKS</text>
      <text x="556" y="421" fill="#c2c7b3">EVENT HANDLE</text>
      <text x="818" y="255" fill="#c2c7b3">REPLAY</text>
      <text x="1010" y="369" fill="#ff6b35">DROP</text>
    </g>

    <g fill="#12150f" stroke="#7a8469" stroke-width="2">
      <circle cx="118" cy="463" r="11"/>
      <circle cx="366" cy="370" r="11"/>
      <circle cx="638" cy="390" r="11"/>
      <circle cx="830" cy="267" r="11"/>
    </g>
    <circle cx="1028" cy="372" r="11" fill="#ff6b35" filter="url(#glow)"/>

    <text x="78" y="578" fill="#7a8469" font-size="14" letter-spacing="2.2">CAPTURE → EVENT: → REPLAY → ROUTE: → EXPLAIN</text>
    <text x="1045" y="578" fill="#d7ff3f" font-size="14" letter-spacing="1.4">traceq/0.1.0</text>
  </g>
</svg>

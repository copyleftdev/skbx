name: publish crates

on:
  release:
    types: [published]

concurrency:
  group: crates-io-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'copyleftdev/skbx'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install eBPF build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes linux-tools-generic clang llvm libelf-dev libpcap-dev pkg-config
          bpftool_bin="$(find /usr/lib -type f -name bpftool -print -quit)"
          test -n "$bpftool_bin"
          echo "$(dirname "$bpftool_bin")" >> "$GITHUB_PATH"
          "$bpftool_bin" version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "skbx-cli") | .version')"
          test "$RELEASE_TAG" = "v$version"
          git tag --points-at HEAD | grep -Fxq "$RELEASE_TAG"

      - name: Test release source
        run: |
          cargo fetch --locked
          cargo test --workspace --all-features --locked --offline
          cargo package --workspace --locked --offline --no-verify

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "skbx-cli") | .version')"

          publish_crate() {
            crate="$1"
            if cargo info --registry crates-io "$crate@$version" >/dev/null 2>&1; then
              echo "$crate@$version is already published; skipping"
              return
            fi

            cargo publish --locked -p "$crate"

            for attempt in $(seq 1 30); do
              if cargo info --registry crates-io "$crate@$version" >/dev/null 2>&1; then
                echo "$crate@$version is available from crates.io"
                return
              fi
              echo "Waiting for $crate@$version to reach the index ($attempt/30)"
              sleep 10
            done

            echo "$crate@$version did not reach the crates.io index" >&2
            return 1
          }

          publish_crate skbx-contract
          publish_crate skbx-core
          publish_crate skbx-sensor
          publish_crate skbx-cli
